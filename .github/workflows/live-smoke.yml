name: Production API playback smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check smoke script syntax
        run: node --check scripts/live-smoke.cjs
      - name: Probe current production Media Catalog API
        run: node scripts/live-smoke.cjs
